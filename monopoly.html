<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Marathon%20Monopoly%20Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      A second HTML entry, served only on monopoly.trackstar.art.

      The app sets its own title and description once React mounts, which is
      enough for a person but not for a link preview: iMessage, Slack and
      LinkedIn read the raw HTML and never run the JavaScript. Sharing the
      partnership page from index.html therefore unfurled as "Trackstar
      Fulfillment — Order fulfillment dashboard", which is the internal tool.

      Keep these three tags in step with useDocumentHead in Monopoly.tsx.
    -->
    <title>Marathon Monopoly</title>
    <meta
      name="description"
      content="The world's greatest marathons, on the most famous board game ever made."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marathon Monopoly" />
    <meta property="og:title" content="Marathon Monopoly" />
    <meta
      property="og:description"
      content="The world's greatest marathons, on the most famous board game ever made."
    />
    <meta property="og:url" content="https://monopoly.trackstar.art/" />
    <!-- Absolute, because unfurlers do not resolve relative image paths. -->
    <meta property="og:image" content="https://monopoly.trackstar.art/monopoly/board.jpg" />
    <meta property="og:image:width" content="1400" />
    <meta property="og:image:height" content="1400" />
    <meta property="og:image:alt" content="The Marathon Monopoly board" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Marathon Monopoly" />
    <meta
      name="twitter:description"
      content="The world's greatest marathons, on the most famous board game ever made."
    />
    <meta name="twitter:image" content="https://monopoly.trackstar.art/monopoly/board.jpg" />

    <!--
      Unlisted, not secret. Matt sends this to named races; a competitor or an
      unapproached race finding the offer and the live availability board is the
      thing being avoided. Unfurlers still preview a noindex page, because this
      is a search directive rather than a fetch one.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <script type="text/javascript">
      // Microsoft Clarity records the screen and the address. It runs only on
      // the public pages that show nothing private: the Creator Program landing
      // page and the Marathon Monopoly page. Never the signed-in app (orders,
      // Support, Settings), and never a page with an access token in its address
      // (approval, Manage your order, photo upload, intake, a creator invite).
      // An allowlist, so a new page is left out until someone adds it here.
      // The same rule is in index.html and monopoly.html.
      var clarityHost = location.hostname, clarityPath = location.pathname.replace(/\/+$/, '') || '/'
      var clarityOn = ((clarityHost === 'creator.trackstar.art' && (clarityPath === '/' || clarityPath === '/apply'))
        || (clarityHost === 'monopoly.trackstar.art' && (clarityPath === '/' || clarityPath === '/monopoly')))
        && !/[?&]invite=/.test(location.search)
      if (clarityOn)
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "q7vs0c7m8a");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
